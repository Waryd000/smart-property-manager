name: Django checks

on:
  push:
    branches: [main, "loop/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_property_manager
          POSTGRES_USER: spm_user
          POSTGRES_PASSWORD: ci-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spm_user -d smart_property_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-only-not-for-deployment"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      DB_NAME: smart_property_manager
      DB_USER: spm_user
      DB_PASSWORD: ci-password-only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TIME_ZONE: Africa/Kampala
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check committed migrations match current models
        run: python manage.py makemigrations --check --dry-run
      - name: Check Django configuration
        run: python manage.py check
      - name: Apply database migrations
        run: python manage.py migrate --noinput
      - name: Run automated tests
        run: python manage.py test --verbosity=2
      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f compose.production.yml config --quiet
      - name: Build production container
        run: docker build --tag smart-property-manager:ci .
