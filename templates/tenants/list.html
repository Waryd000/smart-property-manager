{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Tenants</h2><div><a class="btn btn-primary" href="new/">Add tenant</a> <a class="btn btn-outline-primary" href="tenancies/new/">Create tenancy</a></div></div><table class="table table-striped"><thead><tr><th>Name</th><th>Phone</th><th>Email</th></tr></thead><tbody>{% for t in tenants %}<tr><td>{{ t.full_name }}</td><td>{{ t.phone }}</td><td>{{ t.email }}</td></tr>{% empty %}<tr><td colspan="3">No tenants registered.</td></tr>{% endfor %}</tbody></table>{% endblock %}
