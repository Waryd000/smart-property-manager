name: Django checks

on:
  push:
    branches: [main, "loop/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_property_manager
          POSTGRES_USER: spm_user
          POSTGRES_PASSWORD: ci-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spm_user -d smart_property_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-for-deployment"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: smart_property_manager
      DB_USER: spm_user
      DB_PASSWORD: ci-password-only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      TIME_ZONE: Africa/Kampala
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate and commit missing initial migrations
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          python manage.py makemigrations accounts properties tenants rent payments operations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounts/migrations properties/migrations tenants/migrations rent/migrations payments/migrations operations/migrations
          if ! git diff --cached --quiet; then
            git commit -m "Add initial database migrations"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify migrations are committed and current
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Run automated tests
        run: python manage.py test --verbosity=2
